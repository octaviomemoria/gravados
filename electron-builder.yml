# PACKAGE-WIN (refinamento pos-MVP). Gera um instalador Windows real do app ja construido em
# `out/` (por `electron-vite build` - `pnpm build`, sempre roda ANTES do empacotamento, nunca
# reconstruido por aqui). Sem `icon` customizado ainda (usa o padrao do electron-builder) -
# refinamento cosmetico futuro, nao bloqueante pra gerar um .exe funcional.
# `npmRebuild: false` - electron-builder por padrao tenta recompilar modulos nativos
# (`@electron/rebuild`) contra a ABI exata do Electron antes de empacotar. Decisao ja registrada
# pro projeto inteiro (ver README "Decisoes de arquitetura" #2): `better-sqlite3` 13.x usa binarios
# N-API pre-compilados (`prebuilds/*.node`), estaveis entre Node e Electron sem rebuild - a
# recompilacao automatica so falha aqui (caminho do projeto com espacos/parenteses quebra o
# toolchain node-gyp) sem nenhum ganho, ja que o binario certo ja esta em `node_modules` e e
# desempacotado via `asarUnpack` abaixo.
npmRebuild: false

appId: com.meetingstudio.app
productName: Meeting Studio
copyright: Copyright © 2026 Meeting Studio

directories:
  output: dist-installer
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# `getMigrationsFolderPath()` (app-paths.ts) ja esperava isso desde muito antes deste incremento -
# `app.isPackaged` faz o boot procurar as migrations em `process.resourcesPath/migrations`, nunca
# dentro de `out/` (que so tem JS compilado - os `.sql` crus de `main/database/migrations/` nunca
# passam pelo bundler, `drizzle-orm` os LE do disco em runtime). Achado real ao testar o instalador
# gerado: sem este `extraResources`, o app abria e travava em "Falha ao aplicar migrations" no
# primeiro boot - pasta padrao de migrations no pacote instalado ficava vazia.
extraResources:
  - from: src/main/database/migrations
    to: migrations

# `externalizeDepsPlugin` (electron.vite.config.ts) mantem as dependencias do processo main FORA
# do bundle (require()'d em runtime) - o electron-builder empacota `node_modules` de producao
# automaticamente a partir de `dependencies` no package.json, entao nada extra precisa ser listado
# aqui alem do proprio `out/`.

# Modulos nativos/binarios (.node/.exe) NUNCA funcionam de dentro do app.asar (Node/Electron nao
# conseguem `dlopen`/`spawn` um arquivo dentro do arquivo archive) - `asarUnpack` os extrai pra
# `app.asar.unpacked`, que o Electron redireciona transparentemente (mesmo caminho aparente) tanto
# pra leitura de arquivo quanto pra spawn de processo. Cobre: `better-sqlite3` (binding nativo),
# `ffmpeg-static`/`ffprobe-static` (binarios spawned via child_process), `onnxruntime-node` (binding
# nativo usado por `@huggingface/transformers`), `sharp` (binding nativo, dependencia transitiva).
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/ffprobe-static/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meeting Studio

# STORE-PREP (refinamento pos-MVP, preparacao tecnica pedida pelo usuario - "existe forma de
# distribuir na Windows Store?"). SO a config do pacote MSIX/APPX em si - NAO faz parte do target
# `win` padrao acima (que continua gerando so o NSIS de sempre via `pnpm dist:win`), pra nao mudar
# o comportamento ja validado do instalador atual. Gerado sob demanda via `pnpm dist:win:appx`.
#
# `identityName`/`publisher` propositalmente OMITIDOS aqui - segundo a doc do electron-builder,
# `publisher` "nao e usado se o AppX for gerado so para teste" (que e o caso agora, sem conta no
# Partner Center ainda). Um pacote gerado assim serve pra TESTAR localmente (sideload com o modo de
# desenvolvedor do Windows ativado) e pra confirmar que o app funciona dentro do sandbox MSIX, mas
# NAO pode ser submetido a Store de verdade sem antes reservar o nome do app no Partner Center - o
# proprio Partner Center atribui o `identityName`/`publisher` corretos, que precisam substituir
# estes valores antes de qualquer submissao real.
#
# Capabilities escolhidas com cuidado - cada uma reflete uma permissao que o app JA usa de verdade:
# `microphone`/`webcam` (captura real de audio/video), `graphicsCapture` (necessaria pro
# `desktopCapturer`/captura de tela funcionar dentro do sandbox MSIX - sem ela a lista de telas/
# janelas vem vazia), `documentsLibrary`/`broadFileSystemAccess` (a biblioteca padrao vive em
# Documentos, fora da pasta virtualizada de dados do app - sem `broadFileSystemAccess` o app so
# enxergaria seus proprios arquivos dentro do container MSIX). `broadFileSystemAccess` e uma
# "restricted capability" - a Microsoft exige justificativa explicita na submissao pra Store,
# mesmo sendo tecnicamente valida aqui; risco real de fricção extra na certificação, documentado no
# README.
appx:
  applicationId: MeetingStudio
  identityName: MeetingStudio
  displayName: Meeting Studio
  publisherDisplayName: Meeting Studio
  languages:
    - pt-BR
    - en-US
  capabilities:
    - microphone
    - webcam
    - graphicsCapture
    - documentsLibrary
    - broadFileSystemAccess

# `asar: true` (padrao do electron-builder) - todo o resto do app fica compactado num unico
# arquivo, exceto o que `asarUnpack` extrai explicitamente acima.
