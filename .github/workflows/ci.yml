name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Windows-first (10_TESTING_QA.md): evita risco de cross-compile do modulo nativo
    # better-sqlite3 e mantem paridade com o ambiente-alvo do MVP.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Ordem minima exigida por 10_TESTING_QA.md: install -> lint -> typecheck -> unit/integration -> build
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Job separado (10_TESTING_QA.md: "Full E2E pode rodar em job separado").
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `pnpm install` baixa o binario do Electron via o script `postinstall` do proprio
      # package.json (node node_modules/electron/install.js) - nao usa `playwright install`,
      # que so gerencia navegadores (chromium/firefox/webkit), nao o pacote `electron`.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
